<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>梦藏 · 玻璃珠收藏</title><link rel="stylesheet" href="style.css"></head>
<body><div id="backplate" aria-hidden="true"></div><div id="scene" aria-hidden="true"></div><div id="orbs"></div>
<div id="count" aria-hidden="true"></div><div id="tip" hidden></div>
<nav id="pages" hidden><button id="previous" aria-label="上一组笔记">↑</button><span id="page"></span><button id="next" aria-label="下一组笔记">↓</button></nav>
<aside id="preview" hidden aria-label="笔记预览"><header><span id="topic"></span><button id="close" aria-label="关闭笔记预览">×</button></header><h2 id="title"></h2><div id="text" tabindex="0"></div><footer><span id="source"></span><button id="reveal">回到原文 ↗</button></footer><p id="error" role="status"></p></aside>
<div id="fallback" hidden>玻璃珠暂未载入，请从菜单栏打开回看。</div>
<script type="module" src="app.js"></script></body></html>
