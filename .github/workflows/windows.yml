name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install the supported official Harness
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'deepseek-harness-0.2.1-rc.3.exe'
          Invoke-WebRequest -Uri 'https://download.deepseek.com/dsh-desk/bin/win-x64/deepseek-harness-0.2.1-rc.3-win-x64.exe' -OutFile $installer
          $expected = 'q5IGr2Bf+TvvCpagHj49Ypn/ZrqR7kqrYpLjqXP7VfDINmddlqZQmG+YfsdL3q3EdTRMRlKz/a3jDAEzdNdDOw=='
          $actual = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $installer -Algorithm SHA512).Hash))
          if ($actual -ne $expected) { throw 'Official Harness installer checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'huikan-host/宿主验证/DeepSeek Harness'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Harness installer exited with $($process.ExitCode)" }
          if (!(Test-Path "$destination/DeepSeek Harness.exe")) { throw 'Harness executable missing' }
          "HUIKAN_HARNESS_EXE=$destination/DeepSeek Harness.exe" >> $env:GITHUB_ENV
      - name: Verify official installation discovery
        shell: pwsh
        run: node scripts/check-windows-harness.cjs
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm test
      - run: npm run package:win
      - name: Install the generated installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "../huikan-release/windows/Huikan-$version-windows-x64-setup.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'huikan-installed/回看/Huikan'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (!(Test-Path "$destination/Huikan.exe")) { throw 'Installed executable missing' }
          "HUIKAN_INSTALLED_EXE=$destination/Huikan.exe" >> $env:GITHUB_ENV
      - name: Launch, save, and restore in the installed application
        shell: pwsh
        run: node scripts/smoke-packaged.cjs "$env:HUIKAN_INSTALLED_EXE"
      - name: Verify installed Codex MCP capture and setup
        shell: pwsh
        run: node scripts/smoke-codex.cjs "$env:HUIKAN_INSTALLED_EXE"
      - name: Verify native Windows glass and capture composited evidence
        shell: pwsh
        run: node scripts/smoke-windows-glass.cjs "$env:HUIKAN_INSTALLED_EXE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huikan-windows-glass-evidence
          path: dist/windows-glass/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify automatic plugin installation with official Harness
        shell: pwsh
        run: node scripts/smoke-windows-harness.cjs "$env:HUIKAN_INSTALLED_EXE" "$env:HUIKAN_HARNESS_EXE"
      - name: Prepare downloadable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force | Out-Null
          Copy-Item ../huikan-release/windows/Huikan-*-windows-x64-setup.exe dist/windows/
          Copy-Item harness-plugin/packages/mengcang-harness-recall-*.tgz dist/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: huikan-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
